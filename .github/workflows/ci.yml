name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo run -- --check examples/backup.basis
      - run: cargo run -- --check examples/dungeon.basis
      - run: cargo run -- build examples/hello.basis -o /tmp/basisread-hello
      - run: test "$(/tmp/basisread-hello)" = "Hello, Ransom"
      - run: cargo run -- build examples/game-smoke.basis -o /tmp/basisread-game-smoke
      - run: test "$(/tmp/basisread-game-smoke)" = $'Health: 21\n1'
