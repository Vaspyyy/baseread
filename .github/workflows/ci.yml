name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo run -- build examples/hello.basis -o /tmp/basisread-hello
      - run: test "$(/tmp/basisread-hello)" = "Hello, Ransom"
